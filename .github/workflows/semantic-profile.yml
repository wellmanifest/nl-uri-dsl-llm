name: semantic-profile

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: semantic profile / conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "jsonschema>=4.26,<5"
      - name: Verify semantic profile contract
        run: python -m pytest tests/test_semantic_profile.py -q
